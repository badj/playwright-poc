name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 17 * * *'  # 5am NZT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to Ubuntu 26 from Oct 2026
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy  # Update version as needed
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # No more separate browser install or system deps needed!

      # playwright-ai-reporter keeps the last 30 runs here for flaky detection and the trend panel
      - name: Restore test history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ai-reporter-results/history.json
          key: test-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: test-history-${{ github.ref_name }}-

      - name: Run Playwright tests (headed)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test
        env:
          # AI failure analysis runs only when the ANTHROPIC_API_KEY repo secret is set, and never on pull requests
          AI_PROVIDER: ${{ github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY != '' && 'anthropic' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5-5

      - name: Save test history
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ai-reporter-results/history.json
          key: test-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Test Health Report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: test-health-report
          path: |
            test-results/test-health-report.html
            test-results/fixes/
          retention-days: 5

      - name: Upload Monocart report artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: monocart-report
          path: monocart-report/
          retention-days: 5

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 5

      # Publish the latest reports to GitHub Pages (main branch only - never pull requests)
      - name: Build report site for GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/build-report-site.js
        env:
          RUN_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}

      - name: Upload report site
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/

  deploy-reports:
    needs: test
    if: always() && needs.test.result != 'cancelled' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to Ubuntu 26 from Oct 2026
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Deploy reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
