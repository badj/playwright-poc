name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 17 * * *'  # 5am NZT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to Ubuntu 26 from Oct 2026
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy  # Update version as needed
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # No more separate browser install or system deps needed!

      # playwright-ai-reporter keeps the last 30 runs here for flaky detection and the trend panel
      - name: Restore test history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ai-reporter-results/history.json
          key: test-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: test-history-${{ github.ref_name }}-

      - name: Run Playwright tests (headed)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test
        env:
          # AI failure analysis runs only when the ANTHROPIC_API_KEY repo secret is set, and never on pull requests
          AI_PROVIDER: ${{ github.event_name != 'pull_request' && secrets.ANTHROPIC_API_KEY != '' && 'anthropic' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5-5

      - name: Save test history
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ai-reporter-results/history.json
          key: test-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Test Health Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-health-report
          path: |
            test-results/test-health-report.html
            test-results/fixes/
          retention-days: 2

      - name: Upload Monocart report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: monocart-report
          path: monocart-report/
          retention-days: 2

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 2

      # Allure 3 (npm, no Java) - published to GitHub Pages by publish-reports.yml, served over https which avoids the CORS issue of opening the report from disk
      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results -o allure-report --name "Playwright POC Allure Report"

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: allure-report
          path: allure-report/
          retention-days: 2
